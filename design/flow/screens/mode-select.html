<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Truthy: Choose a class</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass+Mono:wght@400;600&family=Overpass:wght@600;800&display=swap" rel="stylesheet">
<style>
:root {
  --sky-1: #a9d6f0;
  --sky-2: #c4e3f5;
  --sky-3: #ddeff8;
  --sky-4: #f3f0e6;
  --surface: var(--sky-2);
  --surface-raised: #fdfbf5;
  --surface-sunk: #eef3f5;
  --ink: #10233f;
  --ink-muted: #56667c;
  --rule: #c9d3dc;
  --accent: #f5b400;
  --true: #1d5cc0;
  --false: #b3321c;
  --correct: #0d7250;
  --wrong: #b3321c;
  --on-dark: #fdfbf5;
  --cloud: #ffffff;
  --r: 16px; --r-sm: 8px;
  --shadow: 0 1px 0 rgba(16,35,63,.06), 0 22px 36px -18px rgba(16,35,63,.45);
  --t1: 120ms; --t2: 220ms; --t3: 360ms;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --sans: 'Overpass', system-ui, sans-serif;
  --mono: 'Overpass Mono', ui-monospace, monospace;
  --notch: 12px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--surface); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
button, a { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
button { border: 0; background: none; padding: 0; cursor: pointer; }
svg { display: block; }

#app {
  position: relative; width: 100%; max-width: 390px; height: 100%; margin: 0 auto;
  display: flex; flex-direction: column; padding: 52px 16px 34px; overflow: hidden;
  background: linear-gradient(180deg,
    var(--sky-1) 0 22%, var(--sky-2) 22% 48%, var(--sky-3) 48% 76%, var(--sky-4) 76% 100%);
}
.cloud { position: absolute; fill: var(--cloud); opacity: .7; pointer-events: none; }

/* header: back + title */
.top { display: flex; align-items: center; gap: 12px; height: 56px; position: relative; z-index: 1; }
.close {
  width: 48px; height: 48px; flex: none; border-radius: 50%;
  display: grid; place-items: center; background: var(--surface-raised); color: var(--ink);
  box-shadow: 0 1px 0 rgba(16,35,63,.1), 0 6px 12px -6px rgba(16,35,63,.4);
  transition: transform var(--t1) var(--ease);
}
.close:active { transform: scale(.92); }
.top h1 { margin: 0; font-weight: 800; font-size: 24px; line-height: 1.1; letter-spacing: -.015em; }
.top p { margin: 4px 0 0; font-family: var(--mono); font-size: 12px; color: var(--ink); }

/* ticket */
.stage { flex: 1; position: relative; margin-top: 12px; }
.card { position: relative; }
.shadowbox { position: absolute; inset: 0; border-radius: var(--r); box-shadow: var(--shadow); pointer-events: none; }
.main {
  position: relative; border-radius: var(--r) var(--r) 0 0; overflow: hidden;
  background:
    radial-gradient(circle at 0 100%, transparent var(--notch), var(--surface-raised) calc(var(--notch) + .5px)) left / 51% 100% no-repeat,
    radial-gradient(circle at 100% 100%, transparent var(--notch), var(--surface-raised) calc(var(--notch) + .5px)) right / 51% 100% no-repeat;
  padding-bottom: 16px;
}
.carrier {
  height: 44px; padding: 0 16px; display: flex; align-items: center; gap: 10px;
  background: var(--accent); color: var(--ink);
  font-weight: 800; font-size: 16px; letter-spacing: -.01em;
}
.carrier small { margin-left: auto; font-family: var(--mono); font-weight: 600; font-size: 12px; letter-spacing: .06em; }
.legs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 8px; padding: 14px 20px 12px; }
.leg code { display: block; font-family: var(--mono); font-weight: 600; font-size: 34px; line-height: 1; letter-spacing: .02em; }
.leg span { display: block; margin-top: 6px; font-size: 12px; font-weight: 600; color: var(--ink-muted); line-height: 1.25; }
.leg.to { text-align: right; }
.legs .fly { padding-bottom: 26px; color: var(--ink); }
.meta { display: grid; grid-template-columns: 1.1fr 1fr 1fr; margin: 0 20px; border-top: 1.5px solid var(--rule); border-bottom: 1.5px solid var(--rule); }
.meta div { padding: 8px 0 7px; }
.meta div + div { padding-left: 12px; border-left: 1.5px solid var(--rule); }
.meta dt { font-family: var(--mono); font-size: 10.5px; color: var(--ink-muted); letter-spacing: .04em; }
.meta dd { margin: 2px 0 0; font-family: var(--mono); font-weight: 600; font-size: 15px; white-space: nowrap; }
.perf {
  position: absolute; left: calc(var(--notch) + 6px); right: calc(var(--notch) + 6px); bottom: 0; height: 2px;
  background: repeating-linear-gradient(90deg, var(--rule) 0 7px, transparent 7px 12px);
}

/* lower: the class list on the stub */
.stub {
  position: relative; border-radius: 0 0 var(--r) var(--r);
  background:
    radial-gradient(circle at 0 0, transparent var(--notch), var(--surface-raised) calc(var(--notch) + .5px)) left / 51% 100% no-repeat,
    radial-gradient(circle at 100% 0, transparent var(--notch), var(--surface-raised) calc(var(--notch) + .5px)) right / 51% 100% no-repeat;
  padding: 16px 8px 8px;
}
.stub .row { display: flex; justify-content: space-between; align-items: baseline; padding: 0 12px 6px;
  font-family: var(--mono); font-size: 12px; color: var(--ink-muted); }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.opt {
  position: relative; display: grid; grid-template-columns: 24px 1fr 96px; gap: 12px; align-items: start;
  padding: 12px; border-radius: var(--r-sm); border: 1.5px solid transparent; cursor: pointer;
  transition: background-color var(--t2) var(--ease), border-color var(--t2) var(--ease);
}
.opt + .opt::before {
  content: ''; position: absolute; left: 12px; right: 12px; top: -1px; height: 1.5px; background: var(--rule);
}
.opt:has(input:checked)::before, .opt:has(input:checked) + .opt::before { opacity: 0; }
.opt input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
.opt:has(input:checked) { background: var(--surface-sunk); border-color: var(--ink); }
.opt:has(input:focus-visible) { outline: 3px solid var(--ink); outline-offset: 2px; }
.mark {
  width: 24px; height: 24px; margin-top: 1px; border-radius: 50%; border: 2px solid var(--ink-muted);
  display: grid; place-items: center; color: var(--surface-raised);
  transition: background-color var(--t1) var(--ease), border-color var(--t1) var(--ease);
}
.mark svg { opacity: 0; transform: scale(.4); transition: opacity var(--t1) var(--ease), transform var(--t2) var(--spring); }
.opt:has(input:checked) .mark { background: var(--ink); border-color: var(--ink); }
.opt:has(input:checked) .mark svg { opacity: 1; transform: none; }
.name { display: block; font-weight: 800; font-size: 18px; line-height: 1.2; letter-spacing: -.01em; }
.what { display: block; margin-top: 2px; font-weight: 600; font-size: 14px; line-height: 1.38; color: var(--ink-muted); }
.best { text-align: right; padding-top: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.best b { display: block; font-family: var(--mono); font-weight: 600; font-size: 13px; line-height: 1.3; }
.best b.none { font-weight: 400; color: var(--ink-muted); }

/* actions */
.actions { position: relative; height: 64px; margin-top: 12px; }
.btn {
  width: 100%; height: 60px; border-radius: 30px; display: flex; align-items: center; justify-content: center; gap: 10px;
  font-weight: 800; font-size: 20px; letter-spacing: -.01em;
  box-shadow: 0 1px 0 rgba(16,35,63,.1), 0 10px 18px -10px rgba(16,35,63,.55);
  transition: transform var(--t1) var(--ease), box-shadow var(--t1) var(--ease);
}
.btn:active { transform: translateY(2px) scale(.98); box-shadow: 0 1px 0 rgba(16,35,63,.1); }
.btn.next { background: var(--ink); color: var(--on-dark); }

:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.btn.next:focus-visible { outline-color: var(--accent); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: 1ms !important; transition-delay: 0ms !important; }
}
</style>
</head>
<body>
<main id="app">
  <svg class="cloud" style="left:-30px;top:196px" width="150" height="46" viewBox="0 0 150 46" aria-hidden="true"><path d="M0 46h150c0-12-10-20-22-20-2-14-14-24-29-24-12 0-22 6-26 16-4-3-9-5-15-5-12 0-21 8-23 19C24 28 20 26 15 26 6 26 0 34 0 46z"/></svg>
  <svg class="cloud" style="right:-40px;top:620px" width="170" height="50" viewBox="0 0 150 46" aria-hidden="true"><path d="M0 46h150c0-12-10-20-22-20-2-14-14-24-29-24-12 0-22 6-26 16-4-3-9-5-15-5-12 0-21 8-23 19C24 28 20 26 15 26 6 26 0 34 0 46z"/></svg>

  <header class="top">
    <button class="close" type="button" aria-label="Back to sections"><svg width="18" height="16" viewBox="0 0 18 16" aria-hidden="true"><path d="M16 8H3M8 2.5L2.5 8 8 13.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div>
      <h1>Choose how to play</h1>
      <p>The class you pick goes on your pass</p>
    </div>
  </header>

  <section class="stage">
    <div class="card">
      <div class="shadowbox"></div>
      <div class="main">
        <div class="carrier">
          <svg width="22" height="16" viewBox="0 0 22 16" aria-hidden="true"><path d="M5 15h13a4 4 0 0 0 .6-8A6 6 0 0 0 7.2 5.5 4.8 4.8 0 0 0 5 15z" fill="currentColor"/></svg>
          Truthy <small>BOARDING PASS</small>
        </div>
        <div class="legs">
          <div class="leg"><code>CLF</code><span>AWS Cloud<br>Practitioner</span></div>
          <svg class="fly" width="40" height="16" viewBox="0 0 40 16" aria-hidden="true"><path d="M1 8h36M30 2l7 6-7 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <div class="leg to"><code>SEC</code><span>Security and<br>compliance</span></div>
        </div>
        <dl class="meta">
          <div><dt>Class</dt><dd id="classField">Classic</dd></div>
          <div><dt>Cards</dt><dd>64</dd></div>
          <div><dt>Gate</dt><dd>F ← → T</dd></div>
        </dl>
        <div class="perf"></div>
      </div>
      <div class="stub">
        <div class="row" aria-hidden="true"><span>Class</span><span>Your best</span></div>
        <fieldset>
          <legend>Class</legend>
          <label class="opt">
            <input type="radio" name="class" value="Classic" checked>
            <span class="mark"><svg width="14" height="14" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 9.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <span><span class="name">Classic</span><span class="what">10 cards, score at the end.</span></span>
            <span class="best"><small class="sr">Your best: </small><b>9 of 10</b></span>
          </label>
          <label class="opt" data-demo>
            <input type="radio" name="class" value="Streak">
            <span class="mark"><svg width="14" height="14" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 9.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <span><span class="name">Streak</span><span class="what">Keep going until the first wrong answer.</span></span>
            <span class="best"><small class="sr">Your best: </small><b>12 in a row</b></span>
          </label>
          <label class="opt">
            <input type="radio" name="class" value="Three lives">
            <span class="mark"><svg width="14" height="14" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 9.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <span><span class="name">Three lives</span><span class="what">The round ends on the third wrong answer.</span></span>
            <span class="best"><small class="sr">Your best: </small><b>21 cards</b></span>
          </label>
          <label class="opt">
            <input type="radio" name="class" value="Timed">
            <span class="mark"><svg width="14" height="14" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 9.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <span><span class="name">Timed</span><span class="what">60 seconds, as many cards as you can.</span></span>
            <span class="best"><small class="sr">Your best: </small><b class="none">Not played</b></span>
          </label>
        </fieldset>
      </div>
    </div>
  </section>

  <div class="actions">
    <button class="btn next" type="button" id="start">Start round <span aria-hidden="true">→</span></button>
  </div>
</main>

<script>
const field = document.getElementById('classField')
document.querySelectorAll('input[name="class"]').forEach(r => r.addEventListener('change', () => {
  if (r.checked) field.textContent = r.value
}))
</script>
</body>
</html>
