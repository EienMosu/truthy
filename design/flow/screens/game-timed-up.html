<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Truthy: Time is up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass+Mono:wght@400;600&family=Overpass:wght@600;800&display=swap" rel="stylesheet">
<style>
:root {
  --sky-1: #a9d6f0;
  --sky-2: #c4e3f5;
  --sky-3: #ddeff8;
  --sky-4: #f3f0e6;
  --surface: var(--sky-2);
  --surface-raised: #fdfbf5;
  --surface-sunk: #eef3f5;
  --ink: #10233f;
  --ink-muted: #56667c;
  --rule: #c9d3dc;
  --accent: #f5b400;
  --true: #1d5cc0;
  --false: #b3321c;
  --correct: #0d7250;
  --wrong: #b3321c;
  --on-dark: #fdfbf5;
  --cloud: #ffffff;
  --r: 16px; --r-sm: 8px;
  --shadow: 0 1px 0 rgba(16,35,63,.06), 0 22px 36px -18px rgba(16,35,63,.45);
  --t1: 120ms; --t2: 220ms; --t3: 360ms;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --sans: 'Overpass', system-ui, sans-serif;
  --mono: 'Overpass Mono', ui-monospace, monospace;
  --notch: 12px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--surface); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
button, a { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
button { border: 0; background: none; padding: 0; cursor: pointer; }
svg { display: block; }

#app {
  position: relative; width: 100%; max-width: 390px; height: 100%; margin: 0 auto;
  display: flex; flex-direction: column; padding: 52px 16px 34px; overflow: hidden;
  background: linear-gradient(180deg,
    var(--sky-1) 0 22%, var(--sky-2) 22% 48%, var(--sky-3) 48% 76%, var(--sky-4) 76% 100%);
}
.cloud { position: absolute; fill: var(--cloud); opacity: .7; pointer-events: none; }

/* header: close + flight path */
.top { display: flex; align-items: center; gap: 12px; height: 56px; position: relative; z-index: 1; }
.close {
  width: 48px; height: 48px; flex: none; border-radius: 50%;
  display: grid; place-items: center; background: var(--surface-raised); color: var(--ink);
  box-shadow: 0 1px 0 rgba(16,35,63,.1), 0 6px 12px -6px rgba(16,35,63,.4);
  transition: transform var(--t1) var(--ease);
}
.close:active { transform: scale(.92); }
.route { flex: 1; min-width: 0; }
.route svg { width: 100%; height: 34px; overflow: visible; }
.route .lbl { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--ink); margin-top: 2px; }
.route .lbl b { font-weight: 600; }

/* stage + ticket */
.stage { flex: 1; position: relative; margin-top: 12px; }
.card { position: absolute; left: 0; right: 0; top: 0; cursor: default; }

.main {
  position: relative; border-radius: var(--r) var(--r) 0 0; overflow: hidden;
  background:
    radial-gradient(circle at 0 100%, transparent var(--notch), var(--surface-raised) calc(var(--notch) + .5px)) left / 51% 100% no-repeat,
    radial-gradient(circle at 100% 100%, transparent var(--notch), var(--surface-raised) calc(var(--notch) + .5px)) right / 51% 100% no-repeat;
  filter: none;
}
.shadowbox { position: absolute; inset: 0; border-radius: var(--r); box-shadow: var(--shadow); pointer-events: none; }
.carrier {
  height: 44px; padding: 0 16px; display: flex; align-items: center; gap: 10px;
  background: var(--accent); color: var(--ink);
  font-weight: 800; font-size: 16px; letter-spacing: -.01em;
}
.carrier small { margin-left: auto; font-family: var(--mono); font-weight: 600; font-size: 12px; letter-spacing: .06em; }
.legs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 8px; padding: 14px 20px 12px; }
.leg code { display: block; font-family: var(--mono); font-weight: 600; font-size: 34px; line-height: 1; letter-spacing: .02em; }
.leg span { display: block; margin-top: 6px; font-size: 12px; font-weight: 600; color: var(--ink-muted); line-height: 1.25; }
.leg.to { text-align: right; }
.legs .fly { padding-bottom: 26px; color: var(--ink); }
.meta { display: grid; grid-template-columns: 1.1fr 1fr 1fr; margin: 0 20px; border-top: 1.5px solid var(--rule); border-bottom: 1.5px solid var(--rule); }
.meta div { padding: 8px 0 7px; }
.meta div + div { padding-left: 12px; border-left: 1.5px solid var(--rule); }
.meta dt { font-family: var(--mono); font-size: 10.5px; color: var(--ink-muted); letter-spacing: .04em; }
.meta dd { margin: 2px 0 0; font-family: var(--mono); font-weight: 600; font-size: 15px; }
.statement {
  margin: 0; padding: 18px 20px 24px;
  font-weight: 600; font-size: 25px; line-height: 1.28; letter-spacing: -.012em; color: var(--ink);
  min-height: 188px; display: flex; align-items: center;
}
.perf {
  position: absolute; left: calc(var(--notch) + 6px); right: calc(var(--notch) + 6px); bottom: 0; height: 2px;
  background: repeating-linear-gradient(90deg, var(--rule) 0 7px, transparent 7px 12px);
}

/* lower: the stub stays on; the clock's verdict is stamped onto it */
.lower { position: relative; height: 228px; }
.stamp {
  display: flex; align-items: center; gap: 8px; padding: 6px 14px 4px;
  border: 3px double currentColor; border-radius: var(--r-sm);
  font-weight: 800; font-size: 24px; letter-spacing: -.01em; transform: rotate(-6deg);
}

.stub {
  position: absolute; inset: 0; border-radius: 0 0 var(--r) var(--r);
  background:
    radial-gradient(circle at 0 0, transparent var(--notch), var(--surface-raised) calc(var(--notch) + .5px)) left / 51% 100% no-repeat,
    radial-gradient(circle at 100% 0, transparent var(--notch), var(--surface-raised) calc(var(--notch) + .5px)) right / 51% 100% no-repeat;
  padding: 22px 20px 14px; display: flex; flex-direction: column; justify-content: space-between;
}
.s-ink { stroke: var(--ink); } .f-ink { fill: var(--ink); } .s-paper { stroke: var(--surface-raised); } .f-paper { fill: var(--surface-raised); }
.f-wrong { fill: var(--wrong); } .f-ok { fill: var(--correct); } .f-acc { fill: var(--accent); }
.stub .row { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--mono); font-size: 12px; color: var(--ink-muted); }
.stub .row b { color: var(--ink); font-weight: 600; font-size: 13px; }
.barcode { height: 76px; width: 100%; color: var(--ink); }
.hint { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 32px;
  font-family: var(--mono); font-size: 13px; color: var(--ink-muted); }

/* time up: the gate closes, the card stays as it was dealt, unanswered */
.route .lbl b#clock { font-size: 13px; font-variant-numeric: tabular-nums; }
.q circle { fill: var(--ink); stroke: var(--ink); }
.statement, .meta dd.closed { color: var(--ink-muted); }
.ustamp {
  position: absolute; left: 50%; top: 96px; z-index: 2; color: var(--ink);
  background: var(--surface-raised); font-size: 28px; padding: 8px 18px 6px; white-space: nowrap;
  transform: translate(-50%, -50%) rotate(-6deg);
  animation: ustamp 300ms var(--spring) 120ms both;
}
@keyframes ustamp { 0% { opacity: 0; transform: translate(-50%, -50%) rotate(-14deg) scale(1.8); } 100% { opacity: 1; transform: translate(-50%, -50%) rotate(-6deg) scale(1); } }
.main { animation: jolt 260ms var(--ease) 240ms; }
@keyframes jolt { 40% { transform: translateY(2px); } }

/* actions */
.actions { position: relative; height: 64px; margin-top: 12px; }
.row2 { position: absolute; inset: 0; display: flex; gap: 12px; }
.btn {
  flex: 1; height: 60px; border-radius: 30px; display: flex; align-items: center; justify-content: center; gap: 10px;
  font-weight: 800; font-size: 20px; letter-spacing: -.01em;
  box-shadow: 0 1px 0 rgba(16,35,63,.1), 0 10px 18px -10px rgba(16,35,63,.55);
  transition: transform var(--t1) var(--ease), box-shadow var(--t1) var(--ease);
}
.btn:active { transform: translateY(2px) scale(.98); box-shadow: 0 1px 0 rgba(16,35,63,.1); }
.btn.next { background: var(--ink); color: var(--on-dark); }
.a-row { animation: rise var(--t2) var(--ease) 300ms both; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }

:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.btn.next:focus-visible { outline-color: var(--accent); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: 1ms !important; transition-delay: 0ms !important; }
}
</style>
</head>
<body>
<main id="app" data-state="up">
  <svg class="cloud" style="left:-30px;top:196px" width="150" height="46" viewBox="0 0 150 46" aria-hidden="true"><path d="M0 46h150c0-12-10-20-22-20-2-14-14-24-29-24-12 0-22 6-26 16-4-3-9-5-15-5-12 0-21 8-23 19C24 28 20 26 15 26 6 26 0 34 0 46z"/></svg>
  <svg class="cloud" style="right:-40px;top:620px" width="170" height="50" viewBox="0 0 150 46" aria-hidden="true"><path d="M0 46h150c0-12-10-20-22-20-2-14-14-24-29-24-12 0-22 6-26 16-4-3-9-5-15-5-12 0-21 8-23 19C24 28 20 26 15 26 6 26 0 34 0 46z"/></svg>

  <header class="top">
    <button class="close" type="button" aria-label="Leave round"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    <div class="route" role="img" aria-label="No time left. 17 cards answered: 14 correct, 3 wrong.">
      <svg viewBox="0 0 276 34" aria-hidden="true">
        <path d="M6 24 Q138 -6 270 24" fill="none" class="s-ink" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="6" cy="24" r="5" class="f-ink"/>
        <g class="q" stroke-width="1.6">
          <circle cx="72" cy="12.75" r="3.5"/><circle cx="138" cy="9" r="3.5"/><circle cx="204" cy="12.75" r="3.5"/>
        </g>
        <circle cx="270" cy="24" r="5" class="f-paper s-ink" stroke-width="1.6"/>
        <g class="plane" transform="translate(270 24) rotate(12.8)"><circle r="12" class="f-acc"/><path d="M-7 0h14M1-6l4 6-4 6M-6-3l2 3-2 3" class="s-ink" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
      </svg>
      <div class="lbl" aria-hidden="true"><span><b id="clock">0:00</b> left</span><span>14 correct · 3 wrong</span></div>
    </div>
  </header>

  <section class="stage">
    <div class="card" id="card">
      <div class="shadowbox"></div>
      <div class="main">
        <div class="carrier">
          <svg width="22" height="16" viewBox="0 0 22 16" aria-hidden="true"><path d="M5 15h13a4 4 0 0 0 .6-8A6 6 0 0 0 7.2 5.5 4.8 4.8 0 0 0 5 15z" class="f-ink"/></svg>
          Truthy <small>BOARDING PASS</small>
        </div>
        <div class="legs">
          <div class="leg"><code>CLF</code><span>AWS Cloud<br>Practitioner</span></div>
          <svg class="fly" width="40" height="16" viewBox="0 0 40 16" aria-hidden="true"><path d="M1 8h36M30 2l7 6-7 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <div class="leg to"><code>SEC</code><span>Security and<br>compliance</span></div>
        </div>
        <dl class="meta">
          <div><dt>Class</dt><dd>Timed</dd></div>
          <div><dt>Card</dt><dd>18</dd></div>
          <div><dt>Gate</dt><dd class="closed">Closed</dd></div>
        </dl>
        <p class="statement">AWS Shield Standard is included for every AWS customer at no extra cost.</p>
        <div class="perf"></div>
      </div>
      <div class="lower">
        <div class="stub">
          <div class="row" aria-hidden="true"><span>CLF → SEC · Timed</span><b>Card 18</b></div>
          <svg class="barcode" id="barcode" aria-hidden="true" preserveAspectRatio="none"></svg>
          <div class="stamp ustamp" role="status"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M11 7.5V12l3 2M8.5 2h5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Time is up</div>
          <div class="hint">This card doesn't count · 17 answered</div>
        </div>
      </div>
    </div>
  </section>

  <div class="actions">
    <div class="row2 a-row">
      <button class="btn next" type="button" id="next">See results <span aria-hidden="true">→</span></button>
    </div>
  </div>
</main>

<script>
// barcode drawn from the card's own data
;(function () {
  const data = 'CLF|SEC|TIMED|18'
  let x = 0, out = ''
  const bar = (w, on) => { if (on) out += `<rect x="${x}" y="0" width="${w}" height="56"/>`; x += w }
  bar(2, 1); bar(1, 0); bar(1, 1); bar(2, 0)
  for (const ch of data) {
    const c = ch.charCodeAt(0)
    for (let b = 0; b < 7; b++) bar((c >> b) & 1 ? 2 : 1, b % 2 === 0)
    bar(1, 0)
  }
  bar(1, 1); bar(1, 0); bar(2, 1)
  const svg = document.getElementById('barcode')
  svg.setAttribute('viewBox', `0 0 ${x} 56`)
  svg.innerHTML = `<g fill="currentColor">${out}</g>`
})()

// The round is over: the only way on is the result. In the app, when the clock hits 0:00
// while a True or False button has keyboard focus, focus moves to "See results".
</script>
</body>
</html>
